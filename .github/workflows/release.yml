name: Verify and package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installable package
        run: npm run package

      - name: Run required package tests
        env:
          CHEMDRAFT_REQUIRE_PACKAGE_TESTS: "1"
        run: npx vitest run src/tests/packageAssetReferences.test.ts src/tests/packageIntegration.test.ts

      - name: Verify package integrity
        run: |
          cd dist/plugin-packages
          sha256sum --check nmr-predictor-*.zip.sha256
          unzip -t nmr-predictor-*.zip

      - name: Preserve release assets
        uses: actions/upload-artifact@v4
        with:
          name: nmr-predictor-${{ github.run_id }}
          path: |
            dist/plugin-packages/nmr-predictor-*.zip
            dist/plugin-packages/nmr-predictor-*.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: nmr-predictor-${{ github.run_id }}
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/nmr-predictor-*.zip \
            release-assets/nmr-predictor-*.zip.sha256 \
            --generate-notes \
            --title "NMR Shift Predictor $GITHUB_REF_NAME" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY"
